# Render Blueprint — Todo List Management System (backend only)
# Deploy with: Render Dashboard → New → Blueprint → select this repo.
# Render reads this file and creates the backend service below.
# The frontend is NOT here anymore — it deploys on Vercel (see DEPLOY.md).
# The database is NOT on Render either — it is Neon (free, permanent).
# Set the DB_* values below on the Render dashboard from your Neon
# connection string (see DEPLOY.md). Secrets / URLs marked sync: false
# must be filled in on the Render dashboard after the services are
# created — they are never in this file.
#
# Why Neon instead of Render Postgres: Render's free database expires
# after 30 days. Neon's free plan has no expiry (1 GB storage,
# 100 compute-hours/month, no credit card).
services:
  # --- Spring Boot backend (Docker, PostgreSQL via `prod` profile) ---
  - type: web
    name: todo-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Free web services spin down after 15 min without traffic; the first
    # request after that takes ~30-60s to wake up. Use Starter ($7/mo) for always-on.
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false # Neon host, e.g. ep-xxx-xxx.ap-south-1.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false # Neon database name, e.g. neondb
      - key: DB_USERNAME
        sync: false # Neon role, e.g. neondb_owner
      - key: DB_PASSWORD
        sync: false # Neon password (from the connection string)
      - key: DB_SSLMODE
        value: require # Neon requires SSL
      - key: JWT_SECRET
        generateValue: true # Render generates a fresh secret — never reuse the dev default
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to your Vercel frontend URL, e.g. https://todo-frontend.vercel.app
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false # usually same as MAIL_USERNAME
      - key: REMINDER_ENABLED
        value: "true"
      - key: REMINDER_CRON
        value: 0 0 8 * * *
