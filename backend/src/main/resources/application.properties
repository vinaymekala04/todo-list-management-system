# ================================
# Server
# ================================
server.port=${PORT:8080}
spring.application.name=todo-list-management-system

# ================================
# Database - MySQL
# Set env vars in production; defaults are for local development only.
# ================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/todo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA / Hibernate
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Run schema.sql only if you want explicit DDL (ddl-auto=update already creates tables).
# spring.sql.init.mode=never

# ================================
# JWT
# JWT_SECRET must be a Base64-encoded key of at least 256 bits for HS256.
# Generate one with: openssl rand -base64 32
# The default below is for local development ONLY - never use it in production.
# ================================
app.jwt.secret=${JWT_SECRET:VG9kb0xpc3RNYW5hZ2VtZW50U3lzdGVtU2VjcmV0S2V5Rm9ySldUU2lnbmluZ0tleTEyMzQ1Ng==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ================================
# Mail - email reminders for due tasks
# All credentials come from env vars; nothing is hardcoded here.
# If MAIL_HOST / MAIL_USERNAME are blank, reminders are skipped and a
# warning is logged instead of crashing (see ReminderService).
# Gmail example: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, and use a
# Gmail App Password as MAIL_PASSWORD (never your normal password).
# ================================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ================================
# Task reminders
# Runs daily at 08:00 by default (cron: second minute hour day month weekday).
# ================================
app.reminder.enabled=${REMINDER_ENABLED:true}
app.reminder.cron=${REMINDER_CRON:0 0 8 * * *}
app.reminder.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ================================
# CORS (React frontend on Vite default port)
# ================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ================================
# Logging
# ================================
logging.level.com.todoapp=INFO
logging.level.org.springframework.security=INFO
