# Production profile — hosted PostgreSQL (Neon).
# Activate with: SPRING_PROFILES_ACTIVE=prod (set on Render in render.yaml).
# Everything not listed here is inherited from application.properties
# (JWT, mail, CORS, logging). Local dev keeps using MySQL with the
# default profile, so this file changes nothing on your laptop.
server.port=${PORT:8080}

# Neon (free, permanent) — set these env vars on the Render backend from
# the connection string in your Neon dashboard:
# DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD.
# Neon requires SSL, so DB_SSLMODE defaults to `require`. Local Docker
# (docker-compose.yml) overrides it to `disable`, since its Postgres
# container has no SSL.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:todo_db}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
