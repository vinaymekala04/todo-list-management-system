# Production profile — Render (PostgreSQL).
# Activate with: SPRING_PROFILES_ACTIVE=prod (set on Render in render.yaml).
# Everything not listed here is inherited from application.properties
# (JWT, mail, CORS, logging). Local dev keeps using MySQL with the
# default profile, so this file changes nothing on your laptop.
server.port=${PORT:8080}

# Render Postgres, wired from render.yaml via fromDatabase:
# DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:todo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
