# Local Docker run (not for Render — Render uses render.yaml instead).
# Usage: docker compose up --build
# Backend: http://localhost:8080 · Frontend is NOT in this file; run it with `npm run dev`.
# This now uses PostgreSQL, matching production on Render.
# Local MySQL still works too: run the backend without SPRING_PROFILES_ACTIVE
# (default profile) against your local MySQL instead — see README-backend.md.
# The password below is a local-dev default only — change it via DB_PASSWORD.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todo123}
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d todo_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: todo_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-todo123}
      DB_SSLMODE: disable # local Postgres has no SSL; cloud (Neon) defaults to require
      JWT_SECRET: ${JWT_SECRET:-VG9kb0xpc3RNYW5hZ2VtZW50U3lzdGVtU2VjcmV0S2V5Rm9ySldUU2lnbmluZ0tleTEyMzQ1Ng==}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
