# Local Docker run (not for Render — Render uses render.yaml instead).
# Usage: docker compose up --build
# Backend: http://localhost:8080 · Frontend is NOT in this file; run it with `npm run dev`.
# MySQL password here is a local-dev default only — change it via DB_PASSWORD.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-todo123}
      MYSQL_DATABASE: todo_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/todo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-todo123}
      JWT_SECRET: ${JWT_SECRET:-VG9kb0xpc3RNYW5hZ2VtZW50U3lzdGVtU2VjcmV0S2V5Rm9ySldUU2lnbmluZ0tleTEyMzQ1Ng==}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
